name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 = Raspberry Pi OS Bookworm, 3.13 = Trixie
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover tests -v
      - name: Shell scripts parse
        run: for f in hub/*.sh client/*.sh; do sh -n "$f"; done
